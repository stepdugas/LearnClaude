spring.application.name=learnclaudeai

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/learnclaudeai}
spring.datasource.username=${DB_USERNAME:stephaniedugas}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Server
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# JWT
jwt.secret=${JWT_SECRET:learnclaudeai-dev-secret-key-change-in-production-must-be-at-least-256-bits}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# Anthropic
anthropic.api.key=${ANTHROPIC_API_KEY:}

# Stripe
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price.monthly=${STRIPE_PRICE_MONTHLY:price_monthly}
stripe.price.yearly=${STRIPE_PRICE_YEARLY:price_yearly}
stripe.price.lifetime=${STRIPE_PRICE_LIFETIME:price_lifetime}
stripe.lifetime.max=100
site.url=${SITE_URL:http://localhost:5173}

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Chat rate limits
chat.daily-limit.free=15
chat.daily-limit.pro=150

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=300s
