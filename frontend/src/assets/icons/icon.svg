<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.855 0 0 0 0 0.467 0 0 0 0 0.337 0 0 0 0.35 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#FAF9F5"/>

  <!-- Asterisk starburst with academic flair -->
  <g filter="url(#glow)" transform="translate(256,256)">
    <!-- 8 organic rounded arms radiating from center -->
    <!-- Each arm is a rounded rect rotated at 45-degree intervals -->
    <!-- The top arm is slightly taller (like a bookmark/mortarboard nod) -->

    <!-- Vertical arm (top — slightly taller for "learning" motif) -->
    <rect x="-18" y="-120" width="36" height="240" rx="18" fill="#DA7756" transform="rotate(0)"/>
    <!-- Horizontal arm -->
    <rect x="-18" y="-105" width="36" height="210" rx="18" fill="#DA7756" transform="rotate(90)"/>
    <!-- 45-degree arms -->
    <rect x="-16" y="-95" width="32" height="190" rx="16" fill="#DA7756" transform="rotate(45)"/>
    <rect x="-16" y="-95" width="32" height="190" rx="16" fill="#DA7756" transform="rotate(135)"/>

    <!-- Center circle — gives it a polished hub -->
    <circle r="32" fill="#DA7756"/>

    <!-- Inner circle — cream cutout for depth -->
    <circle r="14" fill="#FAF9F5"/>

    <!-- Tiny book/page detail at the top of the vertical arm -->
    <g transform="translate(0,-108)">
      <path d="M-8,4 Q0,-4 8,4" stroke="#FAF9F5" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>
